name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      # Lint und Typecheck laufen vorerst nicht-blockierend: der Bestand hat
      # noch offene Befunde (Accessibility, React-Hooks, implizite `any`).
      # Sobald diese abgearbeitet sind, `continue-on-error` entfernen, damit
      # beides zu einem echten Qualitaetsgate wird.
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true
